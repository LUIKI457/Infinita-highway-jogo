<script>

// cena
const scene=new THREE.Scene(),dayC=new THREE.Color(0x87ceeb),nigC=new THREE.Color(0x0a1030),skyC=new THREE.Color();
scene.fog=new THREE.Fog(0x87ceeb,80,330);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.5,400);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
const hemi=new THREE.HemisphereLight(0xffffff,0x4a7a3a,.8),sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(50,100,30);scene.add(hemi,sun);
const M=c=>new THREE.MeshLambertMaterial({color:c});
const road=M(0x2c2c34),roadM=new THREE.MeshLambertMaterial({vertexColors:true}),grass=M(0x4f9d45),trunk=M(0x6b4a2b),leaf=M(0x2e7d32),lampM=M(0x555560),chim=M(0x555560);
const bulbM=new THREE.MeshBasicMaterial({color:0xffe9a0}),beacon=new THREE.MeshBasicMaterial({color:0xff2020}),hM=new THREE.MeshBasicMaterial({color:0xfff6c8});
const NEON=[0xff2bd6,0x2bffd0,0xffd23f,0x4da6ff].map(c=>new THREE.MeshBasicMaterial({color:c})),NM=["Centro","Residencial","Industrial","Comercial"];
function tex(lit){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle=lit?'#000':'#fff';x.fillRect(0,0,64,64);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){if(lit&&Math.random()>.45)continue;x.fillStyle=lit?'#ffe9a0':'#27344a';x.fillRect(i*16+3,j*16+4,10,9)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
const WT=tex(0),WL=tex(1);
const RP=[[0x6c8fb5,0x4f6d8f,0x8fb0cf,0x38506b],[0xd9a066,0xc97b63,0xe3c07a,0xb5524a],[0x7d7f86,0x9a8f7a,0x6b6f78,0x8c6d4f],[0xd05fa0,0x3fb7c9,0xe0b03a,0x7a5fd0]].map(a=>a.map(c=>new THREE.MeshLambertMaterial({color:c,map:WT,emissive:0xffffff,emissiveMap:WL,emissiveIntensity:0})));
const allM=RP.flat();
const roadH=new THREE.PlaneGeometry(S,2*R).rotateX(-Math.PI/2),roadV=new THREE.PlaneGeometry(2*R,S).rotateX(-Math.PI/2),lnH=new THREE.PlaneGeometry(S,.5).rotateX(-Math.PI/2),lnV=new THREE.PlaneGeometry(.5,S).rotateX(-Math.PI/2);
const rg=(()=>{const parts=[[roadH.clone().translate(S/2,.05,0),0x2c2c34],[roadV.clone().translate(0,.05,S/2),0x2c2c34],[lnH.clone().translate(S/2,.08,0),0xf2d64b],[lnV.clone().translate(0,.08,S/2),0xf2d64b]];
  const pos=[],col=[],idx=[];let o=0;for(const[g,c]of parts){const p=g.attributes.position,cc=new THREE.Color(c);for(let i=0;i<p.count;i++){pos.push(p.getX(i),p.getY(i),p.getZ(i));col.push(cc.r,cc.g,cc.b)}for(const j of g.index.array)idx.push(j+o);o+=p.count}
  const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));G.setAttribute('color',new THREE.Float32BufferAttribute(col,3));G.setIndex(idx);G.computeVertexNormals();return G})();
const box=new THREE.BoxGeometry(1,1,1),cyl=new THREE.CylinderGeometry(.4,.5,3,6),cone=new THREE.ConeGeometry(2.4,6,7),lampG=new THREE.BoxGeometry(.3,8,.3).translate(0,4,0),bulbG=new THREE.BoxGeometry(1.4,.4,.8).translate(0,8,0);
const coinG=new THREE.CylinderGeometry(1,1,.3,12).rotateX(Math.PI/2),coinM=new THREE.MeshBasicMaterial({color:0xffd23f});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000).rotateX(-Math.PI/2),grass);scene.add(ground);
const beam=new THREE.Mesh(new THREE.CylinderGeometry(5,5,90,16,1,true),new THREE.MeshBasicMaterial({color:0x2bffd0,transparent:true,opacity:.4,fog:false,side:2}));beam.visible=false;scene.add(beam);
const rnd=(a,b,c)=>{const s=Math.sin(a*127.1+b*311.7+c*74.7+W*17.3)*43758.5453;return s-Math.floor(s)};
const reg=(cx,cz)=>Math.floor(rnd(Math.floor(cx/3),Math.floor(cz/3),300)*4);
const chunks=new Map(),o3=new THREE.Object3D();
function add(g,geo,mat,x,y,z,sx=1,sy=1,sz=1){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);g.add(m);return m}
function inst(g,geo,mat,a){const m=new THREE.InstancedMesh(geo,mat,a.length);a.forEach((p,i)=>{o3.position.set(p[0],p[1],p[2]);o3.scale.set(p[3]||1,p[4]||1,p[5]||1);o3.rotation.set(0,0,0);o3.updateMatrix();m.setMatrixAt(i,o3.matrix)});m.frustumCulled=false;g.add(m);return m}
function bGeo(w,h,d){const g=new THREE.BoxGeometry(w,h,d),u=g.attributes.uv;for(let f=0;f<6;f++){const sx=f<2?d:w,sy=f<4?h:d;for(let i=0;i<4;i++){const n=f*4+i;if(f==2||f==3)u.setXY(n,.02,.02);else u.setXY(n,u.getX(n)*sx/10,u.getY(n)*sy/10)}}return g}
const drop=ch=>{scene.remove(ch.g);ch.geo.forEach(x=>x.dispose());ch.g.traverse(o=>{if(o.isInstancedMesh&&o.dispose)o.dispose()})};
function build(cx,cz){
  const g=new THREE.Group(),rects=[],geo=[],x0=cx*S,z0=cz*S,r=reg(cx,cz),P=RP[r];
  const rd=new THREE.Mesh(rg,roadM);rd.position.set(x0,0,z0);g.add(rd);
  const lp=[];for(let i=0;i<4;i++)lp.push([x0+R+1.2,0,z0+12+i*25],[x0-R-1.2,0,z0+12+i*25],[x0+12+i*25,0,z0+R+1.2],[x0+12+i*25,0,z0-R-1.2]);
  inst(g,lampG,lampM,lp);inst(g,bulbG,bulbM,lp);
  if(rnd(cx,cz,1)<(r==1?.4:r==2?.1:.25)){const tr=[],cr=[];for(let i=0;i<(r==1?16:12);i++){const x=x0+14+rnd(cx,cz,10+i)*72,z=z0+14+rnd(cx,cz,40+i)*72,k=.8+rnd(cx,cz,70+i)*.8;tr.push([x,1.5*k,z,k,k,k]);cr.push([x,5.5*k,z,k,k,k])}inst(g,cyl,trunk,tr);inst(g,cone,leaf,cr)}
  else{for(let i=0;i<4;i++){
    if(rnd(cx,cz,100+i)<.12)continue;
    const q=rnd(cx,cz,110+i),q2=rnd(cx,cz,120+i),q3=rnd(cx,cz,130+i);let w,d,h;
    if(r==0){w=14+q*10;d=14+q2*10;h=30+q3*q3*110}else if(r==1){w=11+q*7;d=11+q2*7;h=5+q3*7}else if(r==2){w=24+q*10;d=22+q2*10;h=9+q3*8}else{w=16+q*12;d=16+q2*12;h=12+q3*q3*26}
    const x=x0+30+(i%2)*40,z=z0+30+(i>>1)*40,gm=bGeo(w,h,d);geo.push(gm);
    const m=new THREE.Mesh(gm,P[Math.floor(rnd(cx,cz,140+i)*4)]);m.position.set(x,h/2,z);g.add(m);rects.push({x,z,w,d});
    if(r==2&&i%2==0)add(g,cyl,chim,x+w/3,18,z,3,12,3);
    if((r==3||r==0)&&rnd(cx,cz,160+i)<.7)add(g,box,NEON[Math.floor(rnd(cx,cz,170+i)*4)],x,Math.min(h*.7,18),z+d/2+.25,w*.6,2.6,.3)}
    if(r==0&&rnd(cx,cz,150)<.08){const gm=bGeo(10,170,10);geo.push(gm);const m=new THREE.Mesh(gm,P[1]);m.position.set(x0+50,85,z0+50);g.add(m);rects.push({x:x0+50,z:z0+50,w:10,d:10});add(g,box,beacon,x0+50,172,z0+50,2,3,2)}}
  const cl=[];for(let i=0;i<4;i++){const v=i<2;cl.push([v?x0+(rnd(cx,cz,200+i)-.5)*8:x0+15+rnd(cx,cz,210+i)*70,1.8,v?z0+15+rnd(cx,cz,220+i)*70:z0+(rnd(cx,cz,230+i)-.5)*8])}
  const ci=inst(g,coinG,coinM,cl);scene.add(g);return{g,rects,geo,cl,ci,al:[1,1,1,1]};
}
// carro
const car=new THREE.Group(),bodyM=M(0xe02020),glass=new THREE.MeshLambertMaterial({color:0x14243a,emissive:0x0a1626}),blk=M(0x15151a),rimM=new THREE.MeshLambertMaterial({color:0xd5d9e2,emissive:0x222222}),neonM=new THREE.MeshBasicMaterial({color:0x2bffd0,transparent:true,opacity:0});
add(car,box,bodyM,0,.75,0,2.1,.7,4.4);add(car,box,bodyM,0,1.05,1.35,1.9,.25,1.6);add(car,box,bodyM,0,1.05,-1.55,1.9,.25,1.2);
add(car,box,glass,0,1.5,-.15,1.7,.62,2.2);add(car,box,bodyM,0,1.84,-.15,1.5,.1,1.6);
add(car,box,blk,0,.4,2.18,1.9,.28,.12);add(car,box,blk,0,.4,-2.18,1.9,.28,.12);
add(car,box,bodyM,0,1.4,-2.05,2.1,.1,.55);add(car,box,blk,-.85,1.2,-2.05,.1,.4,.1);add(car,box,blk,.85,1.2,-2.05,.1,.4,.1);
add(car,box,bodyM,-1.12,1.2,.55,.12,.15,.3);add(car,box,bodyM,1.12,1.2,.55,.12,.15,.3);
const wG=new THREE.CylinderGeometry(.42,.42,.34,14).rotateZ(Math.PI/2),wR=new THREE.CylinderGeometry(.26,.26,.36,8).rotateZ(Math.PI/2),wheels=[];
for(const[x,z,f]of[[-1.06,1.4,1],[1.06,1.4,1],[-1.06,-1.4,0],[1.06,-1.4,0]]){const w=new THREE.Group();w.rotation.order='YXZ';w.add(new THREE.Mesh(wG,blk),new THREE.Mesh(wR,rimM));w.position.set(x,.42,z);car.add(w);wheels.push({w,f})}
add(car,box,neonM,0,.12,0,1.9,.04,4.0);
const tailM=new THREE.MeshBasicMaterial({color:0x660000});
[-.8,.8].forEach(x=>{add(car,box,tailM,x,1,-2.22,.55,.28,.08);add(car,box,hM,x,.95,2.22,.5,.25,.08)});
const hl=new THREE.PointLight(0xfff0c0,0,45);hl.position.set(0,1.5,5);car.add(hl);
scene.add(car);
// controles
const k={l:0,r:0,g:0,b:0,n:0};
const km={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'g',w:'g',ArrowDown:'b',s:'b',' ':'b',Shift:'n'};
addEventListener('keydown',e=>{const c=e.key.length==1?e.key.toLowerCase():e.key;if(km[c]){k[km[c]]=1;e.preventDefault()}
  if(c=='Escape'||c=='p')pause();if(c=='c')camMode=(camMode+1)%3;if(c=='Enter'&&state=='title'){aud();menu()}
  if(c=='r'&&state=='play'){st.x=Math.round(st.x/S)*S;st.z=Math.round(st.z/S)*S;st.vx=st.vz=0}});
addEventListener('keyup',e=>{const c=e.key.length==1?e.key.toLowerCase():e.key;if(km[c])k[km[c]]=0});
[['bl','l'],['br','r'],['bb','b'],['bg','g'],['bn','n']].forEach(([id,key])=>{const el=$(id);
  el.addEventListener('pointerdown',()=>{k[key]=1;el.classList.add('on')});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>{k[key]=0;el.classList.remove('on')}))});
$('pz').addEventListener('pointerdown',pause);
// áudio
let ac,eo,eg;
function aud(){if(ac){ac.resume();return}try{ac=new(window.AudioContext||window.webkitAudioContext)();eo=ac.createOscillator();eo.type='sawtooth';const f=ac.createBiquadFilter();f.frequency.value=520;eg=ac.createGain();eg.gain.value=0;eo.connect(f);f.connect(eg);eg.connect(ac.destination);eo.start()}catch(e){}}
function bp(f,d,t='sine',v=.15,at=0){if(!ac||D.mute)return;const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}
let mi=0;setInterval(()=>{if(!ac||document.hidden)return;const pl=state=='play',n=[220,261.6,329.6,392,329.6,261.6][mi++%6];bp(pl?n/2:n,pl?.4:.9,'triangle',pl?.03:.05);if(mi%6==0)bp(110,pl?.8:2,'sine',pl?.04:.08)},420);
document.addEventListener('visibilitychange',()=>{if(ac)document.hidden?ac.suspend():ac.resume()});
// estado
const st={x:0,z:50,h:0,v:0,vx:0,vz:0,sl:0};
let mode='free',state='menu',tl=0,cpn=0,cur={x:0,z:0},nit=1,sess=0,ang=0,dayT=.25;
const dailySeed=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
const PAINT=[0,0xe02020,0x2b6fff,0x16a34a,0xfacc15,0xf5f5f5,0x111111,0xff2bd6];function applyCar(){bodyM.color.set(D.paint||CARS[D.car].c)}applyCar();
function clear(){for(const c of chunks.values())drop(c);chunks.clear()}
function nextCp(){const n=cpn+1;let dx=Math.floor(rnd(n,1,9)*9)-4,dz=Math.floor(rnd(n,2,9)*9)-4;if(Math.abs(dx)+Math.abs(dz)<3)dx+=4;cur.x=(Math.round(cur.x/S)+dx)*S;cur.z=(Math.round(cur.z/S)+dz)*S;beam.position.set(cur.x,45,cur.z)}
function go(m){aud();$('kh').style.opacity=1;setTimeout(()=>$('kh').style.opacity=0,7000);mode=m;W=m=='free'?D.seed:m=='daily'?dailySeed():Math.floor(Math.random()*1e5)+1;clear();Object.assign(st,{x:0,z:50,h:0,v:0,vx:0,vz:0});nit=1;sess=0;lives=3;rdist=0;nmc=0;traf.forEach(t=>t.on=0);

  state='play';$('ov').style.display='none'}

  show(`<img src="icon.svg" width="96" height="96" style="border-radius:22px;box-shadow:0 0 24px #2bffd088"><h1>INFINITA HIGHWAY</h1><p>🪙 ${D.coins} · ${D.km.toFixed(1)} km · recorde: ${D.best} cp · rush ${D.rbest||0} m</p>

  // visual

  else{const ti=state=='title';ang+=dt*(ti?.15:.3);cam.position.set(st.x+Math.sin(ang)*(ti?8.5:12),ti?1.7:4,st.z+Math.cos(ang)*(ti?8.5:12));cam.lookAt(st.x,ti?1.1:1,st.z)}
